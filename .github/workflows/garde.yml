name: garde

on:
  push:
    branches: [main]
    paths: ["quelle.py", "schema/**", ".github/workflows/garde.yml"]
  pull_request:
    paths: ["quelle.py", "schema/**", ".github/workflows/garde.yml"]
  workflow_dispatch:

concurrency:
  group: garde-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: compile + os + refus qrng
        run: |
          set -e
          python3 -m compileall -q quelle.py
          python3 quelle.py tirer --octets 16 --vers /tmp/c.quelle.json
          if python3 quelle.py tirer --source qrng ; then
            echo "qrng silencieux interdit"
            exit 1
          fi
